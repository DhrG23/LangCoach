<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>💻 Lang Coach — Frontend (v3)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="title-bar">
      <div class="title-text">Lang Coach</div>
      <div class="window-controls">
          <button id="min-btn">—</button>
          <button id="max-btn">☐</button>
          <button id="close-btn">✕</button>
      </div>
  </div>

  <div class="app-container">
    <div class="main-grid">

      <aside class="left-panel">
        <div class="card tab-container full-height"> 
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="coach-tab">🤖 Coach AI</button>
                <button class="tab-button" data-tab="drill-tab">🎯 Drill Mode</button>
            </div>

            <section id="coach-tab" class="tab-content active">
                <h2>🤖 NEURAL COACH AI</h2>
                <div id="chat-history" class="chat-history"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ask the coach for tips..." />
                    <button id="chat-send">SEND >></button>
                </div>
                <div style="margin-top:8px;">
                    <button id="auto-feedback-toggle">🌀 Auto-Feedback: OFF</button>
                    <button id="copy-coach">📋 Copy Last Tip</button>
                </div>
            </section>

            <section id="drill-tab" class="tab-content" style="display:none;">
                <h3>🎯 Drill Mode</h3>
                <div style="margin-bottom: 12px;">
                    <label><input type="checkbox" id="drillModeToggle"> Enable Drill Mode</label>
                </div>
                <div id="drillPanel">
                    <div><strong>Target:</strong> <span id="drillTarget">—</span></div>
                    <div style="margin-top:6px;">
                        <button id="drillRepeat">🔁 Repeat</button>
                        <button id="drillNext">➡️ Next</button>
                        <button id="drillAutoAdvance">Auto Advance: OFF</button>
                    </div>
                    <div style="margin-top:8px;">
                        <small>Heatmap:</small>
                        <div id="phonemeHeatmap" class="phoneme-heatmap" style="display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;"></div>
                    </div>
                </div>
            </section>
        </div>
      </aside>

      <main class="right-panel">
        <header>
          <h1>🗣️ LANGUAGE MATRIX</h1>
          <p class="tagline">Analyse. Refine. Conquer Communication. arigato ✨</p>
        </header>

        <section class="card sentence-card">
          <h2>Practice Sentence</h2>
          <div class="sentence-header">
            <input class="sentence-text" id="sentenceText" value="Hello, how are you?" />
            <div class="controls">
              <label for="lang">Language:</label>
              <select id="lang">
                <option value="en" selected>English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="zh">Chinese</option>
              </select>
            </div>
          </div>
          <div class="buttons" style="margin-top:8px;">
            <button id="playExampleBtn">🔊 Play Example</button>
            <button id="recordBtn">🎙️ START SEQUENCE</button>
            <button id="stopRecordBtn" disabled>⏹️ STOP SEQUENCE</button>
            <button id="wordDrillBtn">🧩 Word Drill</button>
          </div>
        </section>
        
        <div class="card tab-container flex-grow-card" style="margin-top:12px; padding: 0;"> 
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="analysis-tab">📈 Performance Analysis</button>
                <button class="tab-button" data-tab="progress-tab">📊 Progression Log</button>
            </div>

            <section id="analysis-tab" class="tab-content analysis-content active">
                <h2>Performance Analysis</h2>
                <div id="summary" class="summary-line">Start a sequence to access data stream.</div>
                
                <div id="wordListContainer" class="word-list-table">
                    </div>
            </section>

            <section id="progress-tab" class="tab-content progress-content" style="display:none;">
                <h2>Progression Log</h2>
                <p>Scores from this session are tracked here.</p>
                <div class="chart-wrapper">
                    <canvas id="progressChart"></canvas>
                </div>
            </section>
        </div>
              </main>
    </div>
  </div>

  <div id="feedbackModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span class="modal-close" id="modalCloseBtn">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

      <script>

    </script>
    
  <script src="renderer.js"></script>
</body>
</html>
